<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#11111b">
  <title>404 — BlackSpirits</title>
  <style>
    :root{--crust:#11111b;--mantle:#181825;--surface0:#313244;--text:#cdd6f4;--sub:#a6adc8;--mauve:#cba6f7;--lav:#b4befe;--mono:'SF Mono','Cascadia Code',ui-monospace,monospace;--sans:'Segoe UI',system-ui,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--crust);color:var(--text);font-family:var(--sans);padding:24px}
    main{max-width:560px;text-align:center;background:var(--mantle);border:1px solid var(--surface0);border-radius:18px;padding:34px}
    .code{font:800 clamp(3rem,14vw,6rem) var(--mono);color:var(--mauve);line-height:1}
    h1{font-size:1.5rem;margin:16px 0 8px}p{color:var(--sub);line-height:1.7}
    a{display:inline-block;margin-top:18px;padding:10px 16px;border-radius:10px;background:var(--mauve);color:var(--crust);font:700 .85rem var(--mono);text-decoration:none}
    a:hover,a:focus-visible{background:var(--lav)}a:focus-visible{outline:2px solid var(--lav);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Lost between commits?</h1>
    <p>This page does not exist — but the portfolio is one click away.</p>
    <a href="/">Back to BlackSpirits</a>
  </main>
</body>
</html>
